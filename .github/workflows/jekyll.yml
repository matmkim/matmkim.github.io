# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@086ffb1a2090c870a3f881cc91ea83aa4243d408 #v1.195.0
        with:
          ruby-version: "3.1" # Not needed with a .ruby-version file
          bundler-cache: false # 캐시 사용을 중지하고 매번 번들 설치
      - name: Install dependencies
        run: bundle install
      - name: Update site version for cache busting
        run: |
          # 현재 timestamp를 버전으로 사용
          NEW_VERSION=$(date +"%Y%m%d%H%M%S")
          # _config.yml 파일의 site_version 업데이트
          sed -i -E "s/(site_version\s*:\s*\")([^\"]*)(\")/\1$NEW_VERSION\3/" _config.yml
          echo "Updated site_version to $NEW_VERSION"
          
          # 모든 JS와 CSS 파일에 타임스탬프 추가하여 캐시 버스팅 강화
          find assets -type f \( -name "*.js" -o -name "*.css" \) -exec cp {} {}.bak \;
          find assets -type f -name "*.bak" | while read file; do
            orig_file="${file%.bak}"
            mv "$file" "$orig_file"
          done
          
          # .nojekyll 파일이 확실히 존재하는지 확인
          touch .nojekyll
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Cache invalidation for mobile browsers
        run: |
          # 모바일 브라우저를 위한 캐시 무효화 헤더 추가
          echo 'Creating cache control files for mobile browsers...'
          
          # _site 폴더에 .htaccess 추가
          cat > _site/.htaccess << 'EOL'
          # 캐시 제어 헤더
          <IfModule mod_headers.c>
            # 모든 파일에 캐시 제어 헤더 추가
            <FilesMatch "\.(html|htm|js|css|json|xml)$">
              Header set Cache-Control "no-cache, no-store, must-revalidate, max-age=0"
              Header set Pragma "no-cache"
              Header set Expires "0"
            </FilesMatch>
          </IfModule>
          
          # 브라우저 캐싱 방지
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresDefault "access plus 0 seconds"
          </IfModule>
          EOL
          
          # _site 폴더에 _headers 추가 (Netlify 호환)
          cat > _site/_headers << 'EOL'
          # 모든 페이지에 적용
          /*
            Cache-Control: no-cache, no-store, must-revalidate, max-age=0
            Pragma: no-cache
            Expires: 0
            X-Version: {{ site.site_version }}
          EOL
          
          # _site 폴더에 Clear-Site-Data 메타 태그 자동 추가
          find _site -name "*.html" -exec sed -i '/<\/head>/ i\<meta http-equiv="Clear-Site-Data" content="\"cache\", \"storage\"">' {} \;
          
          # _site/index.html에 타임스탬프 속성 추가
          TIMESTAMP=$(date +"%Y%m%d%H%M%S")
          sed -i "s/<html /<html data-version=\"$TIMESTAMP\" /" _site/index.html
          
          # HTML 파일에 버전 메타 태그 추가
          find _site -name "*.html" -exec sed -i "/<meta charset=/a \  <meta name=\"version\" content=\"${TIMESTAMP}\">" {} \;
          
          # HTML 파일에 ETag 헤더용 버전 코멘트 추가
          find _site -name "*.html" -exec sed -i "/<html /a \<!-- Version: ${TIMESTAMP} -->" {} \;
          
          echo 'Cache invalidation files created.'
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
