<!-- start custom head snippets -->

<!-- insert favicons. use https://realfavicongenerator.net/ -->
<link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
<link rel="shortcut icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/favicon.png' | relative_url }}">
<link rel="apple-touch-icon-precomposed" href="{{ '/favicon.png' | relative_url }}">

<!-- Load skin switcher CSS -->
<link rel="stylesheet" href="{{ '/assets/css/skin-switcher.css' | relative_url }}">

<!-- Load FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<!-- Load skin switcher JavaScript -->
<script src="{{ '/assets/js/skin-switcher.js' | relative_url }}" defer></script>

{% if page.custom_css %}
  {% for stylesheet in page.custom_css %}
<link rel="stylesheet" href="{{ stylesheet | relative_url }}">
  {% endfor %}
{% endif %}

<!-- end custom head snippets -->
